services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - expenses_data:/var/lib/postgresql

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      DATABASE_URL: postgres://expenses:expenses@db:5432/expenses?sslmode=disable
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      HTTP_ADDR: :8080
      WEB_DIR: /app/web
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FAMILY_USER_IDS: ${FAMILY_USER_IDS:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      AGENT_MAX_CONTEXT_BYTES: ${AGENT_MAX_CONTEXT_BYTES:-32768}
      AGENT_TURN_TIMEOUT: ${AGENT_TURN_TIMEOUT:-60s}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  expenses_data:
